<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>

<div class="navbar">
    <div>📝 Faculty Workspace</div>
    <div>
        <a href="../index.html">Logout</a>
    </div>
</div>

<div class="box" style="width: 80%; max-width: 700px;">
    <h2>Teacher Panel - Mark Attendance</h2>
    
    <h3>➕ Add Student Profile</h3>
    <input type="number" id="roll" placeholder="Roll No">
    <input type="text" id="name" placeholder="Student Name"><br>
    <input type="text" id="addClass" placeholder="Class">
    <input type="text" id="addSection" placeholder="Section"><br>
    <button onclick="addStudent()">Save Student Profile</button>

    <hr>
    <h3>Select Class & Section</h3>
    <input type="text" id="class" placeholder="e.g. BCA">
    <input type="text" id="section" placeholder="e.g. A"><br>
    <button onclick="loadStudents()">Load Roster</button>

    <h3>Student Roster List</h3>
    <table border="1" id="table">
        <tr>
            <th>Roll</th>
            <th>Name</th>
            <th>Class</th>
            <th>Section</th>
            <th>Present</th>
        </tr>
    </table>
    <br>
    <button onclick="saveAttendance()">Commit & Save Records</button>
</div>

<script>
let filteredStudents = [];

function addStudent() {
    let roll = document.getElementById("roll").value;
    let name = document.getElementById("name").value;
    let cls = document.getElementById("addClass").value;
    let sec = document.getElementById("addSection").value;

    if(!roll || !name || !cls || !sec) { alert("Fill fields"); return; }
    let students = JSON.parse(localStorage.getItem("students")) || [];
    students.push({roll, name, class: cls, section: sec});
    localStorage.setItem("students", JSON.stringify(students));
    alert("Student Profile Added!");
}

function loadStudents() {
    let cls = document.getElementById("class").value;
    let sec = document.getElementById("section").value;
    let students = JSON.parse(localStorage.getItem("students")) || [];
    filteredStudents = students.filter(s => s.class === cls && s.section === sec);

    let table = document.getElementById("table");
    table.innerHTML = `<tr><th>Roll</th><th>Name</th><th>Class</th><th>Section</th><th>Present</th></tr>`;
    
    if(filteredStudents.length === 0){ alert("No students found!"); return; }

    filteredStudents.forEach((s, index) => {
        let row = table.insertRow();
        row.insertCell(0).innerText = s.roll;
        row.insertCell(1).innerText = s.name;
        row.insertCell(2).innerText = s.class;
        row.insertCell(3).innerText = s.section;
        row.insertCell(4).innerHTML = `<input type="checkbox" id="s${index}">`;
    });
}

function saveAttendance() {
    if(filteredStudents.length === 0){ alert("Load roster first!"); return; }
    let allAttendance = JSON.parse(localStorage.getItem("attendance")) || [];
    let date = new Date().toLocaleDateString();
    let records = [];

    filteredStudents.forEach((s, index) => {
        let present = document.getElementById("s"+index).checked;
        records.push({roll: s.roll, name: s.name, class: s.class, section: s.section, present: present});
    });

    allAttendance.push({date: date, records: records});
    localStorage.setItem("attendance", JSON.stringify(allAttendance));
    alert("Attendance Ledger Committed!");
}
</script>

</body>
</html>
